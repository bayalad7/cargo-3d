# Integración continua (CI): revisa cada cambio que se sube a develop o a main.
# Ver docs/src/adr/0012-ramas-y-versiones.md y docs/src/adr/0013-ci-y-release.md
#
# Cuándo corre:
#   - En cada push a develop o main (todo se trabaja directo en develop, ADR-0012).
#
# Qué revisa:
#   1. Backend Go: formato (gofmt), revisión estática (go vet) y pruebas con detector de carreras.
#   2. Que la imagen Docker del backend se construya (no se publica; eso lo hace release.yml).
#
# Todo corre en las máquinas de GitHub: no ocupa espacio en tu disco.

name: CI

on:
  push:
    branches: [develop, main]

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el CI solo necesita leer el código.
permissions:
  contents: read

jobs:
  # 1. Backend Go.
  go:
    name: Go (formato, vet y pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Instala la versión de Go que pide backend/go.mod (una sola fuente de verdad, ADR-0011).
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod # cambiar a backend/go.sum cuando haya dependencias

      - name: gofmt (debe salir vacío)
        run: |
          unformatted="$(gofmt -l backend)"
          if [ -n "$unformatted" ]; then
            echo "::error::Archivos sin formato (corre 'gofmt -w backend'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./backend/...

      # -race detecta accesos simultáneos a memoria entre goroutines (importante desde el sprint 2.2).
      - name: go test
        run: go test -race ./backend/...

  # 2. Imagen Docker del backend: solo se construye para comprobar que el Dockerfile funciona.
  docker:
    name: Imagen Docker (construcción)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          # Las mismas plataformas que publica release.yml.
          platforms: linux/amd64,linux/arm64
          push: false
          # Caché en GitHub Actions para que las siguientes construcciones sean rápidas.
          cache-from: type=gha
          cache-to: type=gha,mode=max
